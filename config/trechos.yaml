# Trechos do rio Iguaçu, de montante para jusante. Cada trecho reúne a usina (quando há) e as réguas que a
# explicam, com o papel de cada uma dito em palavras. Ordem das réguas: área de drenagem crescente
# (config/estacoes.csv). Nomes curtos são só para rótulo; o nome oficial continua no catálogo.
# papel: montante (rio principal, a montante da usina) | afluente (tributário) | barramento | jusante
# margem (afluentes): direita = norte, esquerda = sul, olhando para jusante; definida pela posição da estação em relação ao Iguaçu
trechos:
  - slug: foz-do-areia
    curto: Foz do Areia
    nome: Cabeceira e Foz do Areia
    usina: foz-do-areia
    contexto: "Do Alto Iguaçu até o reservatório de Foz do Areia (Gov. Bento Munhoz), o maior de acumulação da cascata. As réguas de Porto Amazonas a Porto Vitória mostram a onda de cheia chegando ao reservatório; União da Vitória é a referência histórica de cheias da cidade."
    estacoes:
      - {codigo: "65035001", papel: montante, curto: "Porto Amazonas"}
      - {codigo: "65060001", papel: montante, curto: "São Mateus do Sul"}
      - {codigo: "65220001", papel: montante, curto: "Fluviópolis"}
      - {codigo: "65310001", papel: montante, curto: "União da Vitória"}
      - {codigo: "65365801", papel: montante, curto: "Porto Vitória (R5)"}
      - {codigo: "65774400", papel: barramento, curto: "Barramento Foz do Areia"}
    pluviometros: ["2651000", "2651058", "2650028"]
  - slug: segredo
    curto: Segredo
    nome: Segredo
    usina: segredo
    contexto: "Reservatório de Segredo (Gov. Ney Aminthas), logo a jusante de Foz do Areia. Recebe a defluência de Foz do Areia mais o rio Jordão (com as usinas Santa Clara e Fundão, fora do conjunto do ONS para esta bacia)."
    estacoes:
      - {codigo: "65803001", papel: barramento, curto: "Barramento Segredo"}
    pluviometros: ["2651054"]
  - slug: salto-santiago
    curto: Salto Santiago
    nome: Salto Santiago
    usina: salto-santiago
    contexto: "Terceiro e último reservatório de acumulação. A partir daqui a cascata é a fio d'água, e o que Salto Santiago deflui chega às Cataratas em cerca de um dia."
    estacoes:
      - {codigo: "65883051", papel: barramento, curto: "Barramento Salto Santiago"}
    pluviometros: ["2552070", "2551063", "2552030", "2552055", "2551015"]
  - slug: salto-osorio
    curto: Salto Osório
    nome: Salto Osório
    usina: salto-osorio
    contexto: "Fio d'água imediatamente a jusante de Salto Santiago. A defluência de Salto Osório é a entrada da comparação de amortecimento exigida de Baixo Iguaçu (a afluência horária do ONS não serve para isso)."
    estacoes:
      - {codigo: "65889700", papel: afluente, curto: "Rio das Cobras", rio: "rio das Cobras", margem: direita}
      - {codigo: "65894991", papel: barramento, curto: "Barramento Salto Osório"}
    pluviometros: ["2552009", "2553079"]
  - slug: salto-caxias
    curto: Salto Caxias
    nome: Salto Caxias
    usina: salto-caxias
    contexto: "Fio d'água com o rio Chopim entrando pela margem esquerda (régua de Águas do Verê). Balsa Jaracatiá e Boa Vista da Aparecida ficam no remanso; a outorga fixa mínimo de 200 m³/s (ou a natural, com piso de 76) e o ONS já publicou zeros espúrios de defluência aqui."
    estacoes:
      - {codigo: "65960001", papel: afluente, curto: "Águas do Verê (Chopim)", rio: "rio Chopim", margem: esquerda}
      - {codigo: "65970700", papel: montante, curto: "Balsa Jaracatiá"}
      - {codigo: "65971500", papel: montante, curto: "Boa Vista da Aparecida"}
      - {codigo: "65973501", papel: barramento, curto: "Barramento Salto Caxias"}
    pluviometros: ["2553069", "2553089", "2553052", "2652048"]
  - slug: baixo-iguacu
    curto: Baixo Iguaçu
    nome: Baixo Iguaçu
    usina: baixo-iguacu
    contexto: "Última usina antes do Parque Nacional. Recebe Salto Caxias mais os rios Andrada e Capanema. A régua do barramento publica a defluência total e é o cruzamento natural com o dado do ONS; a de jusante confirma o que efetivamente segue para as Cataratas."
    estacoes:
      - {codigo: "65975300", papel: afluente, curto: "Rio Andrada", rio: "rio Andrada", margem: direita}
      - {codigo: "65980200", papel: afluente, curto: "Rio Capanema", rio: "rio Capanema", margem: esquerda}
      - {codigo: "65983100", papel: barramento, curto: "Barramento Baixo Iguaçu"}
      - {codigo: "65984000", papel: jusante, curto: "Jusante Baixo Iguaçu"}
    pluviometros: ["2553071", "2553073"]
  - slug: cataratas
    curto: Cataratas
    nome: Cataratas e Parque Nacional
    usina: null
    contexto: "Trecho livre entre Baixo Iguaçu e a foz no rio Paraná. Porto Capanema e Hotel Cataratas têm réguas de dois operadores no mesmo local (Copel e Itaipu); diferenças entre elas são de curva-chave, não de leitura. A regra que importa aqui é o mínimo de 350 m³/s defluído por Baixo Iguaçu."
    estacoes:
      - {codigo: "65987001", papel: jusante, curto: "Porto Capanema (Copel)"}
      - {codigo: "65987000", papel: jusante, curto: "Porto Capanema (Itaipu)", esquema: false}
      - {codigo: "65992502", papel: jusante, curto: "Hotel Cataratas (Copel)"}
      - {codigo: "65992500", papel: jusante, curto: "Hotel Cataratas (Itaipu)", esquema: false}
      - {codigo: "65993000", papel: jusante, curto: "Salto Cataratas"}
    pluviometros: ["2553070", "2553059"]
